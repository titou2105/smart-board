<!doctype html>

<head>

  <title>Smart Board — Cockpit</title>
  <!-- Rendu du markdown de la vision. Sans Internet, la vision s'affiche en texte brut. -->
  <script src="https://cdn.jsdelivr.net/npm/marked@15.0.7/marked.min.js"></script>
  <style>
    /* Couleurs en variables : un seul endroit à changer pour les thèmes clair et sombre. */
    :root {
      --bg: #f6f5f2; --surface: #ffffff; --surface-2: #f0eee9; --text: #1d1d1f; --muted: #6b6b70;
      --border: #e2dfd8; --accent: #5b4ce0; --todo: #85858b; --progress: #1c7ed6; --done: #2b8a3e;
      --warn: #c2410c; --bar-bg: #e9e6df;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #131316; --surface: #1c1c20; --surface-2: #24242a; --text: #ececef; --muted: #9b9ba3;
        --border: #2d2d34; --accent: #a99cff; --todo: #8a8a92; --progress: #4dabf7; --done: #51cf66;
        --warn: #fb923c; --bar-bg: #2a2a31;
      }
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    main { max-width: 920px; margin: 0 auto; padding: 24px 16px 64px; }
    a { color: var(--accent); }
    header .kicker { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
    header h1 { font-size: 28px; margin: 2px 0 4px; }
    header .tagline { margin: 0 0 4px; }
    header .meta { color: var(--muted); font-size: 13px; margin: 0; }

    nav.tabs { display: flex; gap: 4px; margin: 20px 0 24px; border-bottom: 1px solid var(--border); overflow-x: auto; }
    nav.tabs a { padding: 8px 14px; text-decoration: none; color: var(--muted); border-bottom: 2px solid transparent; white-space: nowrap; }
    nav.tabs a.active { color: var(--text); border-bottom-color: var(--accent); font-weight: 600; }
    nav.tabs .count { font-size: 11px; background: var(--warn); color: #fff; border-radius: 999px; padding: 0 6px; margin-left: 4px; }
    section.tab { display: none; }
    section.tab.active { display: block; }

    .panel { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; margin-bottom: 16px; }
    .panel h2 { font-size: 13px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin: 0 0 8px; }
    .countdown { border-left: 4px solid var(--accent); }
    .countdown .big { font-size: 24px; font-weight: 700; color: var(--accent); margin-right: 8px; }
    .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 16px; }
    .stat { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px; }
    .stat .value { font-size: 24px; font-weight: 700; font-variant-numeric: tabular-nums; }
    .stat .label { color: var(--muted); font-size: 13px; }
    .milestones { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; margin-bottom: 16px; }
    .milestone-card h3 { font-size: 14px; margin: 0; }
    .milestone-card .meta { color: var(--muted); font-size: 13px; }
    .bar { height: 8px; background: var(--bar-bg); border-radius: 4px; overflow: hidden; margin: 8px 0 4px; }
    .bar > div { height: 100%; background: var(--done); }
    .next .story-head { font-size: 17px; font-weight: 600; margin-bottom: 4px; }
    ul.plain { margin: 6px 0 0; padding-left: 20px; }
    .decision-open { border-left: 4px solid var(--warn); }

    .filters { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 16px; }
    .filters button { font: inherit; font-size: 13px; padding: 4px 12px; border-radius: 999px; border: 1px solid var(--border); background: var(--surface); color: var(--text); cursor: pointer; }
    .filters button.active { background: var(--accent); border-color: var(--accent); color: #fff; }
    .milestone-block { margin-bottom: 32px; }
    .milestone-block > h2 { font-size: 20px; margin: 0 0 2px; }
    .milestone-block > p { color: var(--muted); margin: 0 0 12px; }
    .epic { margin-bottom: 18px; }
    .epic h3 { font-size: 15px; margin: 0 0 2px; }
    .epic > p { color: var(--muted); margin: 0 0 8px; font-size: 14px; }
    details.story { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; margin-bottom: 6px; }
    details.story summary { cursor: pointer; padding: 10px 12px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; list-style: none; }
    details.story summary::-webkit-details-marker { display: none; }
    .story-id { font-weight: 600; font-variant-numeric: tabular-nums; }
    .story-title { flex: 1; min-width: 140px; }
    .story-body { padding: 0 12px 12px; font-size: 14px; }
    .note { color: var(--muted); font-style: italic; }
    .badge { font-size: 12px; padding: 1px 8px; border-radius: 999px; border: 1px solid currentColor; white-space: nowrap; }
    .badge.todo { color: var(--todo); } .badge.in_progress { color: var(--progress); } .badge.done { color: var(--done); }
    .badge.muted { color: var(--muted); } .badge.warn { color: var(--warn); }
    .badge.high { color: var(--warn); } .badge.medium { color: var(--progress); } .badge.low { color: var(--muted); }

    .vision { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 8px 20px 20px; }
    .vision table { border-collapse: collapse; width: 100%; display: block; overflow-x: auto; }
    .vision th, .vision td { border: 1px solid var(--border); padding: 6px 8px; text-align: left; vertical-align: top; }
    .vision th { background: var(--surface-2); }
    .vision blockquote { margin: 0; padding: 4px 12px; border-left: 3px solid var(--border); color: var(--muted); }
    .vision pre { white-space: pre-wrap; }
    .vision code { background: var(--surface-2); padding: 1px 4px; border-radius: 4px; }
    .empty { color: var(--muted); }
  </style>
</head>

  <!-- Données injectées par build.mjs : backlog.json + docs/product.md. Ne pas modifier à la main. -->
  <script id="cockpit-data" type="application/json">{"backlog":{"schemaVersion":1,"project":{"name":"Smart Board","tagline":"« Dis-le, c'est rangé. » Une to-do où l'assistant te pose les questions qui manquent.","updatedAt":"2026-11-16"},"milestones":[{"id":"M1","title":"Capture via Claude Code","goal":"Dicter ses tâches dans Claude Code et les voir dans l'app.","estimate":"~7 sessions","targetDate":"2026-11-30"},{"id":"M2","title":"App utilisable et en ligne","goal":"Ajout/modification manuels, démo Vercel, README.","estimate":"~8 sessions","targetDate":"2026-12-18"},{"id":"M3","title":"Partout, avec l'assistant","goal":"Tâches dans le cloud, ajout depuis le téléphone, assistant dans l'app.","estimate":"~19 sessions","targetDate":"2027-02-07"},{"id":"M4","title":"Premières intégrations","goal":"Boîte de réception + mails perso.","estimate":"~9 sessions","targetDate":"2027-02-28"},{"id":"LATER","title":"Après l'horizon","goal":"EPICs pas encore découpés en US.","estimate":null,"targetDate":null}],"epics":[{"id":"E1","milestone":"M1","title":"Capturer ses tâches avec Claude Code","description":"Dicter une tâche dans Claude Code, être relancé sur ce qui manque, la retrouver dans l'app."},{"id":"E2","milestone":"M2","title":"Gérer ses tâches dans l'app","description":"Atelier UI, ajout et modification à la main."},{"id":"E3","milestone":"M2","title":"Démo en ligne et vitrine","description":"Une démo publique sur Vercel et un README portfolio."},{"id":"E4","milestone":"M3","title":"Finitions","description":"Suppression, urgences, cockpit public, synchronisation GitHub Issues."},{"id":"E5","milestone":"M3","title":"Mes tâches partout","description":"Retrouver et ajouter ses tâches depuis le téléphone comme depuis l'ordinateur."},{"id":"E6","milestone":"M3","title":"L'assistant dans l'app","description":"La saisie en une phrase, d'abord via Claude Code, puis via l'API Claude."},{"id":"E7","milestone":"M4","title":"Boîte de réception","description":"Rien n'entre dans la liste sans validation."},{"id":"E8","milestone":"M4","title":"Mails perso","description":"Repérer les mails qui demandent une action et proposer une tâche."},{"id":"E9","milestone":"LATER","title":"Champs enrichis","description":"Priorité, projet, sous-tâches, durée (le modèle est prévu pour)."},{"id":"E10","milestone":"LATER","title":"Dictée vocale","description":"Parler au lieu de taper."},{"id":"E11","milestone":"LATER","title":"« Ma journée »","description":"L'assistant propose chaque matin 3 tâches à attaquer."},{"id":"E12","milestone":"LATER","title":"App mobile native","description":"Expo, en réutilisant src/core/."},{"id":"E13","milestone":"LATER","title":"Rappels","description":"Notification avant l'échéance."},{"id":"E14","milestone":"LATER","title":"Agenda","description":"Synchroniser les échéances, tâches de suivi de réunion."},{"id":"E15","milestone":"LATER","title":"Partage vers Smart Board","description":"Créer une tâche depuis n'importe quelle app du téléphone."}],"stories":[{"id":"US-1.1","epic":"E1","title":"Format des tâches","size":"S","status":"done","story":"En tant que porteur du projet, je veux un format de fichier unique pour les tâches, afin que Claude Code et l'app lisent et écrivent les mêmes données.","criteria":["Une tâche contient titre, description, échéance, statut, source (claude-code, manual, plus tard mail), dates de création et de mise à jour.","Ajouter un champ optionnel plus tard ne casse pas les tâches existantes (testé) ; le fichier porte un schemaVersion.","data/tasks.json est exclu de git ; data/tasks.example.json est versionné.","Une fonction de src/core/ valide le fichier et signale clairement une tâche invalide."],"doneAt":"2026-11-14"},{"id":"US-1.2","epic":"E1","title":"Dicter une tâche avec /tache","size":"M","status":"in_progress","story":"En tant qu'utilisateur, je veux écrire /tache appeler le plombier avant vendredi dans Claude Code, afin d'enregistrer une tâche complète sans formulaire.","criteria":["Claude pose une question par champ manquant (titre, description, échéance), une à la fois.","Les dates relatives (« vendredi », « dans 2 semaines ») sont converties et affichées en clair pour validation.","Claude montre la tâche finale et n'écrit dans data/tasks.json qu'après ma validation."],"note":"Skill .claude/skills/tache + script npm run tasks:add en place (2026-11-15). Reste : test d'acceptation par Thomas dans une nouvelle session."},{"id":"US-1.3","epic":"E1","title":"Mettre à jour une tâche avec /tache","size":"S","status":"todo","story":"En tant qu'utilisateur, je veux dire « plombier : c'est fait » ou « décale le passeport à lundi », afin de tenir ma liste à jour sans ouvrir l'app.","criteria":["Claude retrouve la tâche, montre le changement et l'applique après validation.","En cas de doute entre plusieurs tâches, Claude demande laquelle."]},{"id":"US-1.4","epic":"E1","title":"Interface bilingue EN/FR","size":"S","status":"done","story":"En tant qu'utilisateur, je veux l'app dans ma langue, afin de la comprendre sans effort.","criteria":["La langue suit celle du navigateur, avec l'anglais par défaut ; tous les textes passent par des fichiers en / fr."],"note":"À faire avant US-1.5, pour que chaque écran soit bilingue dès sa livraison (voir DoD).","doneAt":"2026-11-15"},{"id":"US-1.5","epic":"E1","title":"Voir mes tâches par échéance","size":"M","status":"done","story":"En tant qu'utilisateur, je veux voir mes tâches regroupées par urgence (En retard, Aujourd'hui, Cette semaine, Plus tard), afin de savoir quoi faire en premier.","criteria":["L'app lit data/tasks.json en local, et les données fictives en mode démo, via TaskRepository.","Les tâches terminées sont repliées en bas."],"note":"Vue provisoire, à revoir lors de l'atelier UI (US-2.1). Les détails techniques d'un fichier invalide ne sont qu'en français (messages de validation de src/core).","doneAt":"2026-11-15"},{"id":"US-2.1","epic":"E2","title":"Atelier UI","size":"M","status":"done","story":"En tant que porteur du projet, je veux comparer plusieurs maquettes de vues, afin de choisir une interface qui me convainc vraiment.","criteria":["Au moins 3 maquettes (dont la liste par échéance), testées sur ordinateur et sur téléphone.","Décision notée dans le CLAUDE.md (vue par défaut, vues secondaires, données affichées)."],"doneAt":"2026-11-16","note":"Prototype cliquable : docs/design/atelier.html (3 directions, 3 accents, clair/sombre, téléphone/ordinateur). Choix : direction A (D14)."},{"id":"US-2.2","epic":"E2","title":"Ajouter une tâche à la main","size":"S","status":"todo","story":"En tant qu'utilisateur, je veux ajouter une tâche dans l'app sans passer par Claude Code, afin de garder la main quand je n'ai pas le terminal.","criteria":["L'enregistrement est refusé tant qu'un champ obligatoire est vide, avec un message clair."]},{"id":"US-2.3","epic":"E2","title":"Modifier une tâche et changer son statut","size":"S","status":"todo","story":"En tant qu'utilisateur, je veux corriger une tâche et la passer à « en cours » ou « faite », afin de suivre l'avancement.","criteria":["Les changements sont enregistrés dans le même fichier que celui de /tache."]},{"id":"US-2.4","epic":"E2","title":"Appliquer le design system","size":"S","status":"todo","tech":true,"story":"En tant que porteur du projet, je veux le thème « Calme & précis » (accent indigo) dans l'app, afin que chaque écran suive les mêmes couleurs, la même typo et le mode sombre sans couleur en dur.","criteria":["Le thème est généré par build.mjs (src/app/theme.css) et importé dans globals.css ; les blocs de couleurs shadcn sont supprimés.","La police Inter est chargée ; l'app suit le thème clair ou sombre du système.","Aucune couleur en dur dans le code des écrans (recherche #rrggbb, rgb(, bg-[#)."],"note":"Débloque US-2.5. Procédure : skill design, mode Appliquer."},{"id":"US-2.5","epic":"E2","title":"Voir mes tâches dans la nouvelle liste","size":"M","status":"todo","story":"En tant que Thomas, je veux la liste de la direction A (bilan de la semaine, filtre perso/pro, lignes à cocher), afin de voir d'un coup d'œil où j'en suis cette semaine et cocher une tâche en un geste.","criteria":["Un bilan affiche les tâches faites sur celles prévues cette semaine, et le nombre en cours, avec une barre de progression.","Le filtre Tout / Perso / Pro filtre les sections et le bilan.","Chaque ligne affiche la case ronde, le titre, l'échéance relative (« Demain », « ven. 20 nov. »), le badge « En cours » plein et la catégorie ; cocher marque la tâche comme faite dans data/tasks.json.","Vérifié à 375 px et en large, en clair et en sombre ; textes en anglais et en français."],"note":"Remplace la vue provisoire de l'US-1.5. Le détail et l'ajout restent ceux des US-2.2 et US-2.3. Dépend de US-2.4."},{"id":"US-3.1","epic":"E3","title":"Démo publique","size":"S","status":"todo","story":"En tant que recruteur, je veux ouvrir la démo depuis un lien, afin de tester l'app sans rien installer.","criteria":["L'app est en ligne sur Vercel (offre gratuite), sur des données fictives.","Chaque push sur main met à jour la démo automatiquement."]},{"id":"US-3.2","epic":"E3","title":"Données de démo","size":"S","status":"todo","story":"En tant que visiteur, je veux une liste d'exemple et un bouton « Réinitialiser », afin de tester sans craindre de tout casser.","criteria":["Chaque visiteur a sa propre liste (dans son navigateur)."]},{"id":"US-3.3","epic":"E3","title":"README portfolio","size":"M","status":"todo","story":"En tant que recruteur, je veux comprendre le projet en 1 minute depuis GitHub, afin d'évaluer le travail de Thomas.","criteria":["README en anglais avec pitch, lien de démo, captures ou GIF, stack, lancement en local.","La capture via Claude Code est expliquée (c'est un point original du projet)."]},{"id":"US-4.1","epic":"E4","title":"Supprimer une tâche","size":"S","status":"todo","story":"En tant qu'utilisateur, je veux supprimer une tâche devenue inutile, afin de garder une liste propre.","criteria":["Une confirmation est demandée avant la suppression."]},{"id":"US-4.2","epic":"E4","title":"Repérer les urgences","size":"S","status":"todo","story":"En tant qu'utilisateur, je veux un signal visuel sur les tâches en retard ou dues aujourd'hui, afin de ne rien rater.","criteria":["Un badge « En retard » ou « Aujourd'hui » s'affiche sur les tâches non terminées concernées."]},{"id":"US-4.3","epic":"E4","title":"Cockpit public","size":"S","status":"todo","story":"En tant que recruteur, je veux voir la vision et le backlog du projet, afin de constater la démarche produit.","criteria":["Le cockpit et la vision sont accessibles en ligne depuis le README."]},{"id":"US-4.4","epic":"E4","title":"Synchroniser le backlog avec GitHub Issues","size":"S","status":"todo","story":"En tant que porteur du projet, je veux que les US de backlog.json apparaissent en Issues, afin de les suivre aussi sur GitHub.","criteria":["Un script crée ou met à jour les Issues à partir du JSON (le JSON reste la source de vérité)."],"note":"Réutiliser le script de PreDriver Coach. Nécessite le dépôt GitHub."},{"id":"US-5.1","epic":"E5","title":"Mes tâches dans le cloud","size":"M","status":"todo","story":"En tant qu'utilisateur, je veux que mes tâches soient stockées en ligne, afin d'y accéder depuis n'importe quel appareil.","criteria":["Implémentation Supabase (offre gratuite) de TaskRepository ; les écrans ne changent pas.","Un script importe une fois les tâches de data/tasks.json.","/tache écrit dans Supabase."]},{"id":"US-5.2","epic":"E5","title":"Me connecter","size":"M","status":"todo","story":"En tant qu'utilisateur, je veux me connecter avec un lien reçu par mail, afin que personne d'autre ne voie mes tâches.","criteria":["Connexion Supabase Auth par lien magique, sans mot de passe.","Chaque utilisateur ne voit que ses propres tâches (règles de sécurité côté base).","La démo publique reste accessible sans compte, sur des données fictives."]},{"id":"US-5.3","epic":"E5","title":"Ajouter une tâche depuis mon téléphone","size":"S","status":"todo","story":"En tant qu'utilisateur, je veux ouvrir Smart Board sur mon téléphone comme une app et y ajouter une tâche, afin de capturer une idée n'importe où.","criteria":["L'app s'installe sur l'écran d'accueil du téléphone (web app installable).","L'ajout manuel est confortable sur petit écran."]},{"id":"US-6.1","epic":"E6","title":"Dire ma tâche en une phrase dans l'app","size":"L","status":"todo","story":"En tant qu'utilisateur, je veux écrire ma tâche dans l'app comme dans /tache, afin de ne pas dépendre du terminal.","criteria":["Sur l'ordinateur, l'assistant passe par Claude Code (claude -p, abonnement) ; en démo, par le mock.","La réponse respecte le contrat AssistantTurn de src/core/assistant.ts."],"note":"Socle déjà en place : findMissingFields et l'assistant mock, testés."},{"id":"US-6.2","epic":"E6","title":"Questions de relance et validation","size":"M","status":"todo","story":"En tant qu'utilisateur, je veux que l'assistant me demande ce qui manque puis me montre la tâche, afin de ne rien enregistrer d'incomplet ou de faux.","criteria":["Une question par champ manquant ; je peux abandonner à tout moment ; rien n'est créé sans validation."]},{"id":"US-6.3","epic":"E6","title":"Passer à l'API Claude","size":"M","status":"todo","story":"En tant qu'utilisateur sur mon téléphone (et visiteur de la démo), je veux le vrai assistant en ligne, afin de dicter une tâche sans mon PC.","criteria":["LLM_PROVIDER=claude utilise l'API côté serveur ; la clé n'est jamais envoyée au navigateur.","Un plafond d'appels par jour évite toute mauvaise surprise sur la facture."],"note":"⚠️ L'API Claude est payante à l'usage (quelques centimes par mois avec un petit modèle et un plafond)."},{"id":"US-6.4","epic":"E6","title":"Évaluer l'assistant","size":"M","status":"todo","story":"En tant que porteur du projet, je veux un jeu de 20 phrases avec le résultat attendu, afin de mesurer la qualité de l'assistant à chaque changement.","criteria":["Un script affiche le taux de champs correctement extraits."]},{"id":"US-7.1","epic":"E7","title":"Valider les tâches proposées","size":"M","status":"todo","story":"En tant qu'utilisateur, je veux voir les tâches proposées et les accepter, modifier ou rejeter, afin que rien n'entre dans ma liste sans mon accord.","criteria":["Une tâche acceptée passe dans la liste avec sa source ; une tâche rejetée disparaît."]},{"id":"US-8.1","epic":"E8","title":"Connecter ma boîte mail perso","size":"L","status":"todo","story":"En tant qu'utilisateur, je veux connecter ma boîte mail perso en lecture seule, afin que l'assistant puisse y repérer des tâches.","criteria":["Connexion sécurisée (OAuth), lecture seule, aucun mot de passe stocké par l'app."],"note":"⚠️ Fournisseur à confirmer (Gmail, Outlook…) : les API diffèrent."},{"id":"US-8.2","epic":"E8","title":"Repérer les mails qui demandent une action","size":"L","status":"todo","story":"En tant qu'utilisateur, je veux que l'assistant propose une tâche quand un mail demande une action, afin de ne plus rien laisser dormir dans ma boîte.","criteria":["Chaque proposition arrive dans la boîte de réception avec un lien vers le mail d'origine.","Seuls le titre, un résumé et le lien sont conservés, pas le contenu complet du mail."]},{"id":"US-8.3","epic":"E8","title":"Couper la connexion","size":"S","status":"todo","story":"En tant qu'utilisateur, je veux déconnecter ma boîte mail en un clic, afin de garder le contrôle sur mes données.","criteria":["La déconnexion révoque l'accès et supprime les jetons stockés."]}],"decisions":[{"id":"D1","status":"decided","date":"2026-11-13","question":"Quel support ?","decision":"Web d'abord (Next.js), mobile ensuite, logique métier partagée dans src/core/."},{"id":"D2","status":"decided","date":"2026-11-13","question":"Quels champs obligatoires ?","decision":"Titre, description, échéance."},{"id":"D3","status":"decided","date":"2026-11-13","question":"Comment saisir les tâches ?","decision":"D'abord via Claude Code (/tache, coût couvert par l'abonnement) ; l'ajout manuel dans l'app reste possible.","related":["E1"]},{"id":"D4","status":"decided","date":"2026-11-13","question":"Quel assistant ?","decision":"Claude Code d'abord, API Claude ensuite (pour la version en ligne et le téléphone).","related":["E6"]},{"id":"D5","status":"decided","date":"2026-11-13","question":"Quel horizon et quel rythme ?","decision":"3 mois, démo en ligne mi-décembre, 3 sessions par semaine. ⚠️ Glisse à fin février avec l'accès téléphone."},{"id":"D6","status":"decided","date":"2026-11-13","question":"Quelle langue ?","decision":"Bilingue EN/FR, inscrit dans la DoD.","related":["US-1.4"]},{"id":"D7","status":"decided","date":"2026-11-13","question":"Quelle vision long terme ?","decision":"Un outil branché sur le quotidien (mails perso, agenda, partage), toujours avec validation."},{"id":"D8","status":"decided","date":"2026-11-13","question":"Quels mails ?","decision":"Perso uniquement.","related":["E8"]},{"id":"D9","status":"decided","date":"2026-11-13","question":"Où vit le backlog ?","decision":"backlog.json reste la source de vérité ; GitHub Issues générées par script.","related":["US-4.4"]},{"id":"D10","status":"decided","date":"2026-11-13","question":"Quelle approche UI ?","decision":"Pas de colonnes figées, des vues calculées à partir des données. Vue liste par échéance provisoire ; vrai atelier UI en M2.","related":["US-1.5","US-2.1"]},{"id":"D11","status":"decided","date":"2026-11-13","question":"Quel modèle de données ?","decision":"Simple (champs obligatoires + statut + source + dates), extensible par champs optionnels.","related":["US-1.1"]},{"id":"D12","status":"decided","date":"2026-11-13","question":"Quels statuts ?","decision":"À faire / en cours / fait."},{"id":"D13","status":"decided","date":"2026-11-13","question":"Quels appareils ?","decision":"Ordinateur et téléphone → tâches dans le cloud (Supabase, gratuit) à partir du M3.","related":["E5"]},{"id":"D14","status":"decided","question":"Quelle vue par défaut ?","related":["US-2.1"],"date":"2026-11-16","decision":"Direction A de l'atelier (docs/design/atelier.html) : liste par échéance en lignes, case ronde, filtre perso/pro, bilan de la semaine, badge « En cours » plein, « Dis ta tâche… » à portée de pouce. Pas de vue secondaire pour l'instant (la semaine en colonnes de la direction B reste une piste). Dans la liste : titre, échéance relative, statut, catégorie ; la description dans le détail. Accent indigo par défaut. Détails : docs/design.md."},{"id":"D15","status":"open","question":"Horizon : accepter fin février, ou appliquer le plan B ?","options":["Accepter la fin février","Plan B : reporter les mails (E8) après l'horizon et finir sur la boîte de réception"],"related":["E8"]},{"id":"D16","status":"open","question":"Quel fournisseur de mail perso ? Les API diffèrent.","options":["Gmail","Outlook"],"related":["US-8.1"]},{"id":"D17","status":"decided","question":"Créer le dépôt GitHub avant M2 (Vercel et Issues en ont besoin).","related":["US-3.1","US-4.4"],"date":"2026-11-15","decision":"Dépôt privé titou2105/smart-board créé le 2026-11-15, main poussé. À rendre public pour le portfolio (US-3.3)."},{"id":"D18","status":"decided","date":"2026-11-15","question":"Une seule to-do ou deux (Smart Board et carnet/taches.md du portefeuille) ?","decision":"Deux listes assumées pour l'instant : /tache ne marche que dans le projet smart-board, le carnet garde ses tâches transverses. À revoir quand Smart Board aura fait ses preuves.","related":["US-1.2"]},{"id":"D19","status":"decided","date":"2026-11-15","question":"Comment rendre l'interface bilingue sans changer les adresses ?","decision":"next-intl 4.15 avec des routes [locale] invisibles (localePrefix never) : le proxy Next 16 lit la langue du navigateur et réécrit / vers /en ou /fr en interne. Pages pré-générées par langue, compatibles Cache Components. Anglais par défaut. Dictionnaires dans messages/en.json et fr.json, un test vérifie qu'ils ont les mêmes clés.","related":["US-1.4"]},{"id":"D20","status":"decided","date":"2026-11-15","question":"Que veut dire « Cette semaine » dans la vue par échéance ?","decision":"Les 7 prochains jours (« Dans les 7 jours » / « Next 7 days »), pour que le groupe ait un sens même le dimanche. « Aujourd'hui » est calculé à l'heure de Paris.","related":["US-1.5"]},{"id":"D21","status":"decided","date":"2026-11-15","question":"D'où l'app lit-elle les tâches ?","decision":"Interface TaskRepository ; DATA_PROVIDER=mock (défaut, données fictives) ou file (data/tasks.json). Thomas met DATA_PROVIDER=file dans son .env.local.","related":["US-1.5","US-5.1"]}],"risks":[{"id":"R1","risk":"Le planning glisse (accès téléphone +5 sessions, fêtes de fin d'année).","impact":"medium","mitigation":"Plan B avant la démo du 18 décembre : reporter l'atelier UI complet (US-2.1) et mettre en ligne la vue liste du M1 telle quelle."},{"id":"R2","risk":"Coût de l'API Claude une fois l'assistant en ligne.","impact":"low","mitigation":"Petit modèle, plafond d'appels par jour, démo publique en mock."},{"id":"R3","risk":"Les API mail diffèrent selon le fournisseur et touchent à des données perso.","impact":"high","mitigation":"Lecture seule via OAuth, minimum de données conservées, déconnexion en un clic ; choisir le fournisseur tôt (D16)."}]},"vision":"# Smart Board — Vision produit\n\n> v0.3 — 2026-11-13. Relue par Thomas (v0.2 du même jour). Les points marqués ⚠️ restent des hypothèses à confirmer en route.\n> Le backlog (jalons, EPIC, US, décisions, risques) vit dans `docs/cockpit/backlog.json`, pas ici.\n> Cockpit : `docs/cockpit/index.html` (double-clic).\n\n---\n\n## 1. Vision long terme\n\n### Le problème\nOn note ses tâches à la va-vite : « appeler le plombier », « passeport ». Pas de date, pas de contexte.\nTrois semaines plus tard, la tâche est toujours là, floue, et on ne sait plus ni pourquoi ni pour quand.\nEt beaucoup de tâches ne sont jamais notées : elles dorment dans un mail ou un message.\n\n### Pour qui\n- **Cœur de cible** : Thomas d'abord. Un actif qui jongle entre travail, projets perso et administratif.\n- **Ensuite** ⚠️ : les professionnels pressés qui veulent un outil simple, sans paramétrage.\n- **Moment d'usage** : quand une tâche surgit, puis le matin pour faire le point.\n\n### La promesse\n**« Dis-le, c'est rangé. »** Tu dis ta tâche comme elle te vient. L'assistant comprend ce qu'il peut,\n**te pose les questions qui manquent**, une à la fois, et la tâche arrive complète dans ta liste.\n\n### Ce que l'app peut devenir (horizon 3 mois, mi-février 2027)\n**L'ambition** : passer d'une to-do qu'on remplit à la main à un **outil branché sur le quotidien**. Les tâches\narrivent d'elles-mêmes depuis les endroits où elles naissent (mails, agenda, messages), et l'assistant les\npropose sous forme de tâches complètes. **Rien n'est créé sans ta validation**, et l'ajout manuel reste toujours possible.\n\n**Étape 1 — Saisie assistée (M1 à M3)**\n- **Capture via Claude Code** : tu dictes ta tâche dans Claude Code (commande `/tache`), qui te relance et l'enregistre.\n  Coût couvert par l'abonnement Claude existant.\n- **L'app** affiche et organise les tâches ; on peut aussi y ajouter ou modifier une tâche à la main.\n- **L'assistant dans l'app** : d'abord via Claude Code en local (gratuit), puis via l'API Claude (payant, mais utilisable en ligne).\n\n**Étape 2 — Tâches captées automatiquement (M4 et au-delà)** ⚠️\n- 📥 **Boîte de réception** : les tâches proposées attendent ta validation avant d'entrer dans ta liste.\n- 📧 **Mails perso** : l'assistant repère les mails qui demandent une action et propose une tâche.\n- 📅 **Agenda** : les échéances apparaissent dans le calendrier ; une réunion peut générer ses tâches de suivi.\n- 💬 **Messages et réseaux** : la plupart (WhatsApp perso, Instagram, LinkedIn) n'ouvrent pas leurs messages\n  aux applis tierces. Piste réaliste : un **partage** vers Smart Board depuis le téléphone.\n- 📄 **Documents** : une facture transférée devient une tâche « payer avant le… ».\n- **Vie privée** : accès en lecture seule, le minimum de données conservées, chaque connexion se coupe en un clic.\n\n**Partout** : les tâches vivent dans le cloud (Supabase), pour en ajouter depuis le téléphone comme depuis l'ordinateur.\n\n**Plus tard** : champs enrichis (priorité, projet, sous-tâches), dictée vocale, « Ma journée », rappels,\napp mobile native (Expo).\n\n### Ce qu'on ne fera pas\n- ❌ Collaboration en équipe (listes partagées, temps réel) : c'est un outil **personnel**.\n- ❌ Paramétrage avancé (automatisations façon Trello Power-Ups).\n- ❌ Boîte mail pro : on se limite aux mails perso (la DSI bloque en général les applis tierces).\n- ❌ Fonctions payantes, tant que c'est un side project.\n\n### Principes produit\n1. **Pas de tâche incomplète** : titre, description et échéance sont obligatoires. L'assistant insiste, poliment.\n2. **L'assistant propose, tu valides** : s'il déduit une info (ex. « vendredi » → une date), il la montre avant d'enregistrer.\n3. **Une question à la fois** : jamais un formulaire déguisé.\n4. **Une tâche, ce sont des données ; l'écran n'est qu'une vue** : les regroupements (par statut, par échéance…)\n   sont calculés, pas figés dans une structure de colonnes.\n5. **Gratuit d'abord** : tout marche sans clé ni carte bancaire (Claude Code via l'abonnement, sinon mode mock).\n6. **Web d'abord, mobile ensuite** : la logique métier (`src/core/`) ne dépend ni de React ni de Next.js.\n\n---\n\n## 2. Vision court terme\n\n### Objectif\n1. **Thomas utilise Smart Board au quotidien** dès la fin du M1, grâce à la capture via Claude Code.\n2. **Vitrine portfolio** : une démo en ligne, un README en anglais, une démarche produit visible.\n\n### Critères de succès\n- [ ] Thomas enregistre ses vraies tâches dans Smart Board pendant 2 semaines d'affilée.\n- [ ] Une tâche complète s'enregistre en **moins de 30 secondes** via `/tache`.\n- [ ] Thomas ajoute une tâche **depuis son téléphone** et la retrouve sur son ordinateur.\n- [ ] Une **URL publique** permet de tester l'app sans compte ni installation.\n- [ ] Le **README** contient : pitch, captures ou GIF, stack, lancement en local, lien vers ce document.\n\n### Dans le périmètre / hors périmètre\n| Dans le périmètre (horizon 3 mois) | Hors périmètre (plus tard) |\n|---|---|\n| Capture via Claude Code (`/tache`) | Dictée vocale, « Ma journée » |\n| Vue liste par échéance, ajout et modification manuels | Priorité, projet, sous-tâches |\n| Interface bilingue EN/FR | Champs supplémentaires (le modèle est prêt) |\n| Tâches dans le cloud + ajout depuis le téléphone (web) | App mobile native Expo, rappels |\n| Assistant dans l'app (Claude Code, puis API Claude) | Statut « en attente » |\n| Démo web sur Vercel (données fictives) | Agenda, partage depuis le téléphone |\n| Boîte de réception + mails perso | Boîte mail pro, réseaux sociaux |\n\n### Choix de séquencement\n1. **M1 — capture via Claude Code d'abord** : c'est le plus rapide pour avoir de la valeur (Thomas s'en sert tout de suite),\n   et c'est gratuit. L'app se contente d'afficher les tâches.\n2. **M2 — une app utilisable et en ligne** : atelier UI, ajout et modification à la main, démo Vercel et README.\n3. **M3 — mes tâches partout, et l'assistant dans l'app** : les tâches passent dans le cloud (ajout depuis le téléphone),\n   puis l'assistant arrive dans l'app (Claude Code en local, puis l'API Claude).\n4. **M4 — premières intégrations** : boîte de réception et mails perso.\n\n### Où vivent les données\n- **M1-M2, sur le PC de Thomas** : un fichier `data/tasks.json`, écrit par Claude Code (`/tache`) et par l'app.\n  Il est **exclu de git** (données perso) ; un modèle `data/tasks.example.json` est versionné.\n- **À partir du M3, dans le cloud** : Supabase (offre gratuite), accessible depuis le téléphone et l'ordinateur,\n  protégé par une connexion. `/tache` écrit alors dans Supabase ; le fichier local est importé une fois.\n- **Sur la démo en ligne** : des tâches fictives (`src/mocks/tasks.ts`), modifiables dans le navigateur du visiteur.\n- Le code passe toujours par une interface `TaskRepository` (fichier / navigateur / Supabase) : changer de stockage ne touche pas les écrans.\n\n### Un modèle de données simple mais extensible\n- **Aujourd'hui** : titre, description, échéance (obligatoires), statut (`à faire` / `en cours` / `fait`), source, dates de création et de mise à jour.\n- **Demain** : ajouter un champ (projet, priorité, lien…) = un champ **optionnel** de plus, sans casser les tâches existantes.\n- Le fichier porte un numéro de version (`schemaVersion`) pour faire évoluer le format proprement.\n\n### Rythme et estimation\nRythme : 3 sessions par semaine. Tailles : S = 1 session, M = 2, L = 3+.\nJalons, dates cibles et plans B : voir le cockpit (onglets Aperçu et Décisions et risques).\n\n### Definition of Done (DoD)\nUne US est « faite » quand :\n- [ ] Tous ses critères d'acceptation sont remplis.\n- [ ] Les textes affichés existent **en anglais et en français** (aucun texte en dur hors des fichiers de traduction).\n- [ ] La logique métier est dans `src/core/` (sans React), pour être réutilisable sur mobile.\n- [ ] Les types (`npm run typecheck`), le linter (`npm run lint`) et les tests (`npm test`) passent.\n- [ ] Ça a été vérifié dans le navigateur, sur ordinateur et en largeur mobile.\n- [ ] Le statut est mis à jour dans `docs/cockpit/backlog.json`.\n","generatedAt":"2026-11-16T09:27:04.672Z"}</script>
  <script>
    const { backlog, vision, generatedAt } = JSON.parse(document.getElementById("cockpit-data").textContent);
    const STATUS = { todo: "À faire", in_progress: "En cours", done: "Fait" };
    const IMPACT = { high: "Impact fort", medium: "Impact moyen", low: "Impact faible" };
    const SESSIONS = { S: 1, M: 2, L: 3, ...(backlog.settings?.sessionsPerSize ?? {}) };
    const decisions = backlog.decisions ?? [];
    const risks = backlog.risks ?? [];

    // Échappe le texte avant de l'insérer dans la page (évite qu'un « < » casse l'affichage).
    const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
    const fmtDate = (iso) => new Date(iso + "T12:00:00").toLocaleDateString("fr-FR", { day: "numeric", month: "long", year: "numeric" });
    const fmtNum = (n) => n.toLocaleString("fr-FR", { maximumFractionDigits: 1 });
    const plural = (n, word) => `${fmtNum(n)} ${word}${n > 1 ? "s" : ""}`;

    // Index utiles : quel EPIC appartient à quel jalon, quelles US à quel EPIC.
    const epicById = Object.fromEntries(backlog.epics.map((e) => [e.id, e]));
    const milestoneOrder = backlog.milestones.map((m) => m.id);
    const storiesOf = (epicId) => backlog.stories.filter((s) => s.epic === epicId);
    const storiesOfMilestone = (mId) => backlog.stories.filter((s) => epicById[s.epic]?.milestone === mId);
    const planned = backlog.stories.filter((s) => epicById[s.epic]?.milestone !== "LATER");
    const remainingSessions = (stories) => stories.filter((s) => s.status !== "done").reduce((sum, s) => sum + (SESSIONS[s.size] ?? 0), 0);
    const doneCount = (stories) => stories.filter((s) => s.status === "done").length;

    // Prochaine US : d'abord celle en cours, sinon la première « à faire » du jalon le plus proche.
    function nextStory() {
      const inProgress = planned.find((s) => s.status === "in_progress");
      if (inProgress) return inProgress;
      for (const mId of milestoneOrder) {
        if (mId === "LATER") continue;
        const todo = storiesOfMilestone(mId).find((s) => s.status === "todo");
        if (todo) return todo;
      }
      return null;
    }

    // Prochain jalon daté et pas encore terminé, pour le compte à rebours.
    function nextDatedMilestone() {
      // Date locale (toISOString donnerait l'heure UTC, donc la veille en soirée).
      const now = new Date();
      const today = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, "0")}-${String(now.getDate()).padStart(2, "0")}`;
      return backlog.milestones.find((m) => {
        const stories = storiesOfMilestone(m.id);
        return m.targetDate && m.targetDate >= today && doneCount(stories) < stories.length;
      });
    }

    const badge = (cls, text) => `<span class="badge ${cls}">${esc(text)}</span>`;
    function storyBadges(s) {
      return [s.tech ? badge("muted", "tech") : "", badge("muted", s.size), badge(s.status, STATUS[s.status])].join("");
    }
    function storyDetails(s) {
      return `
        <p>${esc(s.story)}</p>
        ${s.criteria.length ? `<strong>Critères d'acceptation</strong><ul class="plain">${s.criteria.map((c) => `<li>${esc(c)}</li>`).join("")}</ul>` : ""}
        ${s.note ? `<p class="note">${esc(s.note)}</p>` : ""}
        ${s.doneAt ? `<p class="note">Fait le ${esc(fmtDate(s.doneAt))}</p>` : ""}
        ${s.issue ? `<p><a href="${esc(s.issue)}">Issue GitHub</a></p>` : ""}`;
    }

    function renderHeader() {
      const p = backlog.project;
      document.title = `${p.name} — Cockpit`;
      document.getElementById("title").textContent = p.name;
      document.getElementById("tagline").textContent = p.tagline ?? "";
      const repo = p.repo ? ` · <a href="https://github.com/${esc(p.repo)}">${esc(p.repo)}</a>` : "";
      document.getElementById("meta").innerHTML =
        `Backlog mis à jour le ${esc(fmtDate(p.updatedAt))} · ${planned.length} US planifiées, ${backlog.epics.length} EPIC${repo}`;
      const open = decisions.filter((d) => d.status === "open").length;
      if (open) document.querySelector('[data-tab="decisions"]').insertAdjacentHTML("beforeend", `<span class="count">${open}</span>`);
    }

    function renderOverview() {
      const m = nextDatedMilestone();
      let countdown = "";
      if (m) {
        const days = Math.ceil((new Date(m.targetDate + "T12:00:00") - new Date()) / 86400000);
        const upTo = backlog.stories.filter((s) => milestoneOrder.indexOf(epicById[s.epic]?.milestone) <= milestoneOrder.indexOf(m.id));
        countdown = `<div class="panel countdown"><span class="big">J-${days}</span>avant <strong>${esc(m.id)} — ${esc(m.title)}</strong> (${esc(fmtDate(m.targetDate))})
          <div class="note">${plural(upTo.length - doneCount(upTo), "US restante")} d'ici là, soit environ ${plural(remainingSessions(upTo), "session")}.</div></div>`;
      }
      const stats = `<div class="stats">
        <div class="stat"><div class="value">${doneCount(planned)}/${planned.length}</div><div class="label">US planifiées faites</div></div>
        <div class="stat"><div class="value">${planned.filter((s) => s.status === "in_progress").length}</div><div class="label">US en cours</div></div>
        <div class="stat"><div class="value">≈ ${fmtNum(remainingSessions(planned))}</div><div class="label">sessions restantes</div></div>
        <div class="stat"><div class="value">${decisions.filter((d) => d.status === "open").length}</div><div class="label">décisions à trancher</div></div>
      </div>`;
      const cards = backlog.milestones.filter((ms) => ms.id !== "LATER").map((ms) => {
        const st = storiesOfMilestone(ms.id);
        const pct = st.length ? Math.round((doneCount(st) / st.length) * 100) : 0;
        return `<div class="stat milestone-card"><h3>${esc(ms.id)} — ${esc(ms.title)}</h3>
          <div class="bar"><div style="width:${pct}%"></div></div>
          <div class="meta">${doneCount(st)}/${st.length} US · ${pct} %${ms.targetDate ? ` · ${esc(fmtDate(ms.targetDate))}` : ""}</div></div>`;
      }).join("");
      const n = nextStory();
      const next = n ? `<div class="panel next"><h2>Prochaine US · ${esc(epicById[n.epic].id)} ${esc(epicById[n.epic].title)}</h2>
          <div class="story-head">${esc(n.id)} — ${esc(n.title)} ${storyBadges(n)}</div>${storyDetails(n)}</div>`
        : `<div class="panel"><h2>Prochaine US</h2><p class="empty">Tout le backlog planifié est fait. 🎉</p></div>`;
      const open = decisions.filter((d) => d.status === "open");
      const toDecide = open.length ? `<div class="panel decision-open"><h2>À trancher</h2><ul class="plain">${open.map((d) => `<li><strong>${esc(d.id)}</strong> — ${esc(d.question)}</li>`).join("")}</ul></div>` : "";
      document.getElementById("tab-apercu").innerHTML = countdown + stats + `<div class="milestones">${cards}</div>` + next + toDecide;
    }

    function renderBacklog(filter = "all") {
      const keep = (s) => filter === "all" || s.status === filter;
      const filters = [["all", "Tout"], ["todo", "À faire"], ["in_progress", "En cours"], ["done", "Fait"]]
        .map(([k, label]) => `<button data-filter="${k}" class="${k === filter ? "active" : ""}">${label}</button>`).join("");
      const blocks = backlog.milestones.map((m) => {
        const epics = backlog.epics.filter((e) => e.milestone === m.id).map((e) => {
          const stories = storiesOf(e.id).filter(keep);
          if (filter !== "all" && !stories.length) return "";
          const list = stories.map((s) => `<details class="story"><summary><span class="story-id">${esc(s.id)}</span>
              <span class="story-title">${esc(s.title)}</span>${storyBadges(s)}</summary><div class="story-body">${storyDetails(s)}</div></details>`).join("");
          const extra = [e.outcome ? `<strong>Valeur :</strong> ${esc(e.outcome)}` : "", e.doneWhen ? `<strong>Fini quand :</strong> ${esc(e.doneWhen)}` : ""]
            .filter(Boolean).map((t) => `<p>${t}</p>`).join("");
          return `<div class="epic"><h3>${esc(e.id)} — ${esc(e.title)}</h3><p>${esc(e.description)}</p>${extra}${list}</div>`;
        }).join("");
        if (!epics.trim()) return "";
        const meta = [m.estimate, m.targetDate ? fmtDate(m.targetDate) : null].filter(Boolean).map(esc).join(" · ");
        return `<div class="milestone-block"><h2>${m.id === "LATER" ? "" : esc(m.id) + " — "}${esc(m.title)}</h2>
          <p>${esc(m.goal)}${meta ? ` · ${meta}` : ""}</p>${epics}</div>`;
      }).join("");
      const tab = document.getElementById("tab-backlog");
      tab.innerHTML = `<div class="filters">${filters}</div>${blocks || '<p class="empty">Aucune US pour ce filtre.</p>'}`;
      tab.querySelectorAll("[data-filter]").forEach((b) => b.addEventListener("click", () => renderBacklog(b.dataset.filter)));
    }

    function renderVision() {
      const tab = document.getElementById("tab-vision");
      if (!vision) { tab.innerHTML = '<p class="empty">Pas de docs/product.md.</p>'; return; }
      // marked vient du CDN ; sans connexion, on affiche le markdown tel quel.
      const html = window.marked ? window.marked.parse(vision) : `<pre>${esc(vision)}</pre>`;
      tab.innerHTML = `<article class="vision">${html}</article>`;
    }

    function renderDecisions() {
      const open = decisions.filter((d) => d.status === "open");
      const decided = decisions.filter((d) => d.status === "decided");
      const decisionItem = (d) => `<div class="panel ${d.status === "open" ? "decision-open" : ""}">
          <strong>${esc(d.id)} — ${esc(d.question)}</strong>${d.related?.length ? " " + d.related.map((r) => badge("muted", r)).join(" ") : ""}
          ${d.options?.length ? `<ul class="plain">${d.options.map((o) => `<li>${esc(o)}</li>`).join("")}</ul>` : ""}
          ${d.decision ? `<p>✅ ${esc(d.decision)}${d.date ? ` <span class="note">(${esc(fmtDate(d.date))})</span>` : ""}</p>` : ""}</div>`;
      const riskItem = (r) => `<div class="panel"><strong>${esc(r.id)} — ${esc(r.risk)}</strong> ${badge(r.impact, IMPACT[r.impact])}
          <p class="note">Parade : ${esc(r.mitigation)}</p></div>`;
      document.getElementById("tab-decisions").innerHTML = `
        <h2>À trancher (${open.length})</h2>${open.map(decisionItem).join("") || '<p class="empty">Rien à trancher.</p>'}
        <h2>Risques (${risks.length})</h2>${risks.map(riskItem).join("") || '<p class="empty">Aucun risque noté.</p>'}
        <h2>Décisions prises (${decided.length})</h2>${decided.map(decisionItem).join("") || '<p class="empty">Aucune pour l\'instant.</p>'}`;
    }

    // Onglets pilotés par l'ancre de l'URL (#backlog…), pour pouvoir partager un lien direct.
    function showTab() {
      const name = (location.hash || "#apercu").slice(1);
      const valid = ["apercu", "backlog", "vision", "decisions"].includes(name) ? name : "apercu";
      document.querySelectorAll("section.tab").forEach((s) => s.classList.toggle("active", s.id === "tab-" + valid));
      document.querySelectorAll("nav.tabs a").forEach((a) => a.classList.toggle("active", a.dataset.tab === valid));
    }

    renderHeader();
    renderOverview();
    renderBacklog();
    renderVision();
    renderDecisions();
    window.addEventListener("hashchange", showTab);
    showTab();
  </script>
</body>
</html>
